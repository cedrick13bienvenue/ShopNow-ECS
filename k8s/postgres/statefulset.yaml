apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shopnow
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: shopnow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopnow-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: shopnow
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
